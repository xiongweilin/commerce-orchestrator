# Prometheus 抓取配置（试验环境）
#
# 抓取目标（Compose 内网）：
#   - api:8000/metrics     API 指标（HTTP RED、idempotency、RBAC denial）
#   - worker:9101/metrics  Worker 指标（heartbeat、inbox、workflow、effect、
#                          reconciliation、privacy cleanup）——端口为 WP4 契约，
#                          worker 进程暴露 /metrics 于 9101，落地时如端口有变需同步本文件。
#
# 告警规则见 ./rules/alerts.yml；每条规则带 runbook_url 注解。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: commerce-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: commerce-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9101
