name: M3 bounded completion staging

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m3/bounded-workflow-completion
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Generate M3 product wiring
        working-directory: backend
        run: uv run python scripts/m3_wire.py
      - name: Format and focused M3 checks
        working-directory: backend
        run: |
          uv run ruff format \
            app/services/workflow_completion.py \
            app/workflows/definitions.py \
            app/workflows/inbox_dispatch.py \
            app/api/v1/workflows.py \
            app/schemas/events.py \
            tests/test_m3_workflow_completion.py
          uv run ruff check --fix \
            app/services/workflow_completion.py \
            app/workflows/definitions.py \
            app/workflows/inbox_dispatch.py \
            app/api/v1/workflows.py \
            app/schemas/events.py \
            tests/test_m3_workflow_completion.py
          uv run ruff check app
          uv run ruff check tests/test_m3_workflow_completion.py
          uv run ruff format --check app
          uv run pytest tests/test_m3_workflow_completion.py tests/test_workflow_v2.py
      - name: Full backend suite
        working-directory: backend
        run: uv run pytest
      - name: Assert M3 scope boundaries
        working-directory: backend
        shell: bash
        run: |
          ! grep -R "portable_runtime\|control_plane\|CompletionAuthority" \
            app/services/workflow_completion.py \
            app/workflows/definitions.py \
            app/workflows/inbox_dispatch.py \
            app/api/v1/workflows.py \
            tests/test_m3_workflow_completion.py
          test "$(grep -R --include='*.py' -E 'status[[:space:]]*=[[:space:]]*WorkflowRunStatus\.COMPLETED' app | wc -l)" -eq 1
      - name: Commit clean M3 product state
        shell: bash
        run: |
          git rm .github/workflows/m3-stage.yml backend/scripts/m3_wire.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app backend/tests/test_m3_workflow_completion.py
          git commit -m "M3: gate workflow completion on declared evidence scope"
          git push origin HEAD:m3/bounded-workflow-completion
