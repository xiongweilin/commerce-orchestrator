name: M1 publication qualification wiring

on:
  push:
    branches:
      - m1/publication-qualification

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m1/publication-qualification
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Apply narrow M1 wiring
        working-directory: backend
        run: uv run python scripts/m1_wire.py
      - name: Format and focused M1 checks
        working-directory: backend
        run: |
          uv run ruff format app/models/publication_qualification.py app/services/publication_qualification.py app/api/v1/publication_qualifications.py app/models/__init__.py app/schemas/commands.py app/api/v1/__init__.py app/main.py app/services/commands.py tests/test_publication_qualification_m1.py alembic/versions/0007_publication_qualification.py
          uv run ruff check app
          uv run ruff format --check app
          uv run pytest tests/test_publication_qualification_m1.py tests/test_migrations_schema.py
      - name: Commit clean M1 product state
        shell: bash
        run: |
          git rm .github/workflows/m1-wire.yml backend/scripts/m1_wire.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app backend/alembic/versions/0007_publication_qualification.py backend/tests/test_publication_qualification_m1.py
          git commit -m "M1: add context-bound publication qualification"
          git push origin HEAD:m1/publication-qualification
