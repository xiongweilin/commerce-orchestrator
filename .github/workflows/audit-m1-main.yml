name: Audit M1 exact main push

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify-main-push:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TARGET_SHA: 8843f3767a2f981e5296e6ad6c0f5ea3b9f47622
    steps:
      - name: Verify exact M1 main push run
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "commerce-m1-main-push-audit",
          }

          def get(url: str):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          payload = get(
              f"https://api.github.com/repos/{repo}/actions/runs"
              f"?branch=main&event=push&head_sha={target}&per_page=20"
          )
          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target
              and run.get("name") == "CI"
          ]
          if not matches:
              raise SystemExit(f"NO_EXACT_MAIN_PUSH_RUN target={target}")
          matches.sort(key=lambda run: int(run.get("run_attempt") or 0), reverse=True)
          run = matches[0]
          print(
              "EXACT_MAIN_PUSH_RUN "
              f"id={run['id']} event={run['event']} branch={run['head_branch']} "
              f"head_sha={run['head_sha']} status={run['status']} "
              f"conclusion={run.get('conclusion')} run_number={run.get('run_number')}"
          )
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("EXACT_MAIN_PUSH_RUN_NOT_SUCCESS")

          jobs = get(run["jobs_url"]).get("jobs", [])
          by_name = {job.get("name"): job for job in jobs}
          for name in ("Backend (lint + tests)", "Console (build)", "Compose (config validation)"):
              job = by_name.get(name)
              print(
                  f"JOB name={name} status={job.get('status') if job else None} "
                  f"conclusion={job.get('conclusion') if job else None}"
              )
              if not job or job.get("status") != "completed" or job.get("conclusion") != "success":
                  raise SystemExit(f"REQUIRED_JOB_NOT_SUCCESS:{name}")
          PY
