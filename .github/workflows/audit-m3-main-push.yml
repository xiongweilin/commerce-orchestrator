name: Audit M3 exact main push

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify-main-push:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact M3 main push run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 13a63bfc03bf0923e9c9297076887ac15517fadb
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPO"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "commerce-m3-main-push-audit",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = None
          for _ in range(20):
              payload = get(
                  f"https://api.github.com/repos/{repo}/actions/runs"
                  f"?branch=main&event=push&head_sha={target}&per_page=20"
              )
              matches = [
                  item
                  for item in payload.get("workflow_runs", [])
                  if item.get("event") == "push"
                  and item.get("head_branch") == "main"
                  and item.get("head_sha") == target
                  and item.get("name") == "CI"
              ]
              if matches:
                  matches.sort(
                      key=lambda item: int(item.get("run_attempt") or 0),
                      reverse=True,
                  )
                  candidate = matches[0]
                  if candidate.get("status") == "completed":
                      run = candidate
                      break
              time.sleep(10)

          if run is None:
              raise SystemExit(f"NO_COMPLETED_EXACT_MAIN_PUSH_RUN target={target}")

          print(
              "EXACT_MAIN_PUSH_RUN "
              f"id={run['id']} event={run['event']} branch={run['head_branch']} "
              f"head_sha={run['head_sha']} status={run['status']} "
              f"conclusion={run.get('conclusion')} run_number={run.get('run_number')}"
          )
          if run.get("conclusion") != "success":
              raise SystemExit("EXACT_MAIN_PUSH_RUN_NOT_SUCCESS")

          jobs = get(run["jobs_url"]).get("jobs", [])
          by_name = {job.get("name"): job for job in jobs}
          required = (
              "Backend (lint + tests)",
              "Console (build)",
              "Compose (config validation)",
          )
          for name in required:
              job = by_name.get(name)
              print(
                  f"JOB name={name} status={job.get('status') if job else None} "
                  f"conclusion={job.get('conclusion') if job else None}"
              )
              if (
                  not job
                  or job.get("status") != "completed"
                  or job.get("conclusion") != "success"
              ):
                  raise SystemExit(f"REQUIRED_JOB_NOT_SUCCESS:{name}")
          PY
