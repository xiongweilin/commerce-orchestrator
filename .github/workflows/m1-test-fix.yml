name: M1 legacy fixture alignment

on:
  push:
    branches: [m1/publication-qualification]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: m1/publication-qualification
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Align only the legacy normalized-fields fixture
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_api_v2.py")
          text = p.read_text(encoding="utf-8")
          old = '''    run = db.get(WorkflowRun, uuid.UUID(workflow_id))\n    item = db.get(WorkItem, uuid.UUID(item["workItemId"]))\n    run.version += 1\n    apply_domain_continuation(\n'''
          new = '''    run = db.get(WorkflowRun, uuid.UUID(workflow_id))\n    item = db.get(WorkItem, uuid.UUID(item["workItemId"]))\n    from app.services.publication_qualification import (\n        append_publication_qualification_assessment,\n    )\n\n    qualification_context = {\n        "purpose": "publish",\n        "policy_version": "policy-v1",\n        "adapter_version": "shopify-v1",\n        "environment_ref": "test",\n    }\n    run.input_json = {**(run.input_json or {}), "qualification_context": qualification_context}\n    append_publication_qualification_assessment(\n        db,\n        catalog_revision_id=uuid.UUID(item.payload_json["revision_id"]),\n        channel="shopify",\n        purpose="publish",\n        policy_version="policy-v1",\n        adapter_version="shopify-v1",\n        environment_ref="test",\n        assessment_status="qualified",\n        evidence_refs=["evidence:test:normalized-fields"],\n    )\n    run.version += 1\n    apply_domain_continuation(\n'''
          if old not in text:
              raise SystemExit("M1 legacy fixture anchor missing")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uv run ruff format tests/test_api_v2.py
          uv run ruff check tests/test_api_v2.py
          uv run pytest tests/test_api_v2.py::test_workflow_detail_normalized_fields tests/test_publication_qualification_m1.py
      - name: Commit clean fixture alignment
        shell: bash
        run: |
          git rm .github/workflows/m1-test-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/tests/test_api_v2.py
          git commit -m "test(m1): provide explicit publication qualification fixture"
          git push origin HEAD:m1/publication-qualification
