name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec "actionlint-py==1.7.12.24" actionlint -color
      - name: zizmor
        run: pipx run "zizmor==1.30.1" --persona=regular .github/workflows
      - name: gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --exit-code 1

  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 只扫描 CI 实际构建/测试的组件：backend 与两个前端 lockfile。
      # services/feedback（embedding extra）不在 compose 断言的部署拓扑内，其 transformers 4.x 漏洞需要未经验证的大版本升级，
      # 因此单独作为待决项，不放进本门禁。
      - name: OSV-Scanner (built surfaces)
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./backend/uv.lock
            --lockfile=./console/package-lock.json
            --lockfile=./services/feedback/web/package-lock.json
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commerce-orchestrator/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: commerce-orchestrator

      - name: Read pinned agent-kernel revision
        id: portable-pin
        working-directory: commerce-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          REV="$(python -c 'import tomllib; print(tomllib.load(open("docs/contracts/responsibility-compatibility.toml", "rb"))["agent_kernel_revision"])')"
          printf 'revision=%s\n' "$REV" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: xiongweilin/agent-kernel
          ref: ${{ steps.portable-pin.outputs.revision }}
          path: agent-kernel
          token: ${{ secrets.AGENT_KERNEL_TOKEN || github.token }}

      - name: Verify agent-kernel checkout
        shell: pwsh
        working-directory: commerce-orchestrator
        run: ./tools/Verify-AgentKernelRevision.ps1 -AgentKernelPath ../agent-kernel

      - name: Install uv (pinned to uv.lock generation version)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev

      - name: Install pinned agent-kernel runtime wheel
        run: uv pip install --python .venv/bin/python --no-deps ../../agent-kernel

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format check
        run: uv run ruff format --check app

      - name: Pytest
        run: uv run pytest

  console:
    name: Console (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  compose:
    name: Compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: commerce-orchestrator

      - name: Read pinned agent-kernel revision
        id: portable-pin
        working-directory: commerce-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          REV="$(python -c 'import tomllib; print(tomllib.load(open("docs/contracts/responsibility-compatibility.toml", "rb"))["agent_kernel_revision"])')"
          printf 'revision=%s\n' "$REV" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: xiongweilin/agent-kernel
          ref: ${{ steps.portable-pin.outputs.revision }}
          path: agent-kernel
          token: ${{ secrets.AGENT_KERNEL_TOKEN || github.token }}

      - name: Verify agent-kernel checkout
        shell: pwsh
        working-directory: commerce-orchestrator
        run: ./tools/Verify-AgentKernelRevision.ps1 -AgentKernelPath ../agent-kernel

      - name: Build backend builder target
        working-directory: commerce-orchestrator
        run: docker build --target builder --build-context agent_kernel=../agent-kernel -t commerce-orchestrator-backend-builder:ci ./backend

      # env_file: .env 要求文件存在；用模板生成（模板内只有占位符）
      - name: Prepare .env from template
        working-directory: commerce-orchestrator
        run: |
          cp .env.example .env
          printf '\nAGENT_KERNEL_CONTEXT=../agent-kernel\n' >> .env

      - name: Validate compose file
        working-directory: commerce-orchestrator
        run: docker compose config -q

      - name: Assert required service topology
        working-directory: commerce-orchestrator
        run: |
          set -euo pipefail
          services="$(docker compose config --services)"
          for s in postgres db-bootstrap migrate api worker console prometheus grafana alertmanager alert-receiver metabase; do
            echo "$services" | grep -qxF "$s" || { echo "missing service: $s"; exit 1; }
          done
