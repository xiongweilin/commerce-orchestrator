name: Legacy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: legacy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-boundary:
    name: legacy boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify frozen predecessor boundary
        run: |
          grep -Fq '**Status: frozen historical predecessor.**' README.md
          grep -q '^# Legacy predecessor compatibility record\.' docs/contracts/responsibility-compatibility.toml
          python - <<'PY'
          import tomllib
          with open("docs/contracts/responsibility-compatibility.toml", "rb") as handle:
              compatibility = tomllib.load(handle)
          assert compatibility["portable_contract_catalog"] == "agent-kernel-contracts-v1"
          assert compatibility["portable_contract_owner"] == "agent-kernel/contracts"
          assert compatibility["agent_kernel_package"] == "agent-kernel"
          PY
      - name: Explain preserved runtime boundary
        run: |
          echo "Commerce is a frozen historical predecessor snapshot."
          echo "Backend, console and Compose runtime acceptance are intentionally not executed."
          echo "Any return to the active architecture requires an explicit migration to world-runtime."

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec "actionlint-py==1.7.12.24" actionlint -color
      - name: zizmor
        run: pipx run "zizmor==1.30.1" --persona=regular .github/workflows
      - name: gitleaks
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git . --redact --no-banner --exit-code 1

  dependencies:
    name: dependencies (informational legacy scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: OSV-Scanner (historical lockfiles)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
      - name: Legacy dependency policy
        run: echo "Historical findings are visible but are not deployability claims for this frozen snapshot."
