name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (pinned to uv.lock generation version)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Install locked dependencies (incl. dev extras)
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check app

      - name: Ruff format check
        run: uv run ruff format --check app

      - name: Pytest
        run: uv run pytest

  console:
    name: Console (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  compose:
    name: Compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # env_file: .env 要求文件存在；用模板生成（模板内只有占位符）
      - name: Prepare .env from template
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Assert required service topology
        run: |
          set -euo pipefail
          services="$(docker compose config --services)"
          for s in postgres db-bootstrap migrate api worker console prometheus grafana alertmanager alert-receiver metabase; do
            echo "$services" | grep -qxF "$s" || { echo "missing service: $s"; exit 1; }
          done
